version: v0.4
project:
  name: Rigidity of complementary quasi-arithmetic centroids
  description: >-
    For two smooth quasi-arithmetic centroid rules on a connected open subset of a
    real Hilbert space, assume boundedly invertible derivatives and a symmetric
    positive-definite Jacobian for one generator. Local balance at one unequal
    input weight or on equally weighted triples forces affine generators and
    arithmetic predictions. For two Bregman gradients this characterizes squared
    Mahalanobis divergences. At half weights the logarithmic Jacobian field is
    constant and commuting. In finite dimension a single basis classifies all
    complementary pairs by opposite log-mean-exp rules and arithmetic axes.
    The formalization also gives the exact scalar triple test, a nonlinear binary
    witness, local existence of the two centroids, and Okamura's shear identity.
  authors: [JD Jones]
  responsible_maintainers: [JD Jones]
  license: MIT
