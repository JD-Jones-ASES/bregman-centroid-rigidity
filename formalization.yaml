fidelity:
  divergences: >-
    Smoothness and invertibility are local. The balance condition uses four nearby points
    satisfying the actual two generator equations. The inverse function theorem supplies
    their centroids. Positive definiteness in Hilbert space is pointwise on nonzero vectors;
    bounded invertibility of the Jacobians is an explicit hypothesis. Unequal weights use
    C2 generators and half weights use C3. Only the fixed-basis classification requires
    finite dimension. The loss theorem uses actual gradients and identifies the full oriented
    divergence. The minimizer interpretation uses the cited Bregman centroid result.
