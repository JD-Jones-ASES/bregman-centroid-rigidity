      prompting_notes: Written arguments, proof construction and source checks under the direction of JD Jones.
review:
  status: self-assessed
  notes: No independent human specialist review has been reported.
fidelity:
  divergences: >-
    Smoothness and invertibility are local. The balance condition uses four nearby points
    satisfying the actual two generator equations. The inverse function theorem supplies
    their centroids. Positive definiteness in Hilbert space is pointwise on nonzero vectors;
    bounded invertibility of the Jacobians is an explicit hypothesis.
